name: Update player character images

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dm-portal-data-sync
  cancel-in-progress: false

jobs:
  update-images:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Download new player images
        run: npx tsx scripts/update-player-images.ts

      - name: Commit and push updated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            data/players.json \
            public/images/players/characters

          if git diff --cached --quiet; then
            echo "Новых образов нет — коммит не нужен."
          else
            git commit -m "chore: update player character images"
            git checkout -- .
            git clean -fd
            git fetch origin main
            git rebase origin/main
            git push
          fi
